[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "room-assembly-toolkit"
version = "0.1.1"
description = "Stateless room recommendation, placement suggestions and 2D placement previews"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "shapely>=1.8,<3"]

[project.optional-dependencies]
render = ["matplotlib>=3.7,<4"]
test = ["pytest>=7,<9", "matplotlib>=3.7,<4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
room_assembly = ["defaults.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

